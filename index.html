    <!-- Preload the responsive hero only on the home route. -->
    <script>
      if (window.location.pathname === '/') {
        const heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/images/hero.webp';
        heroPreload.setAttribute(
          'imagesrcset',
          '/images/hero-800.webp 800w, /images/hero.webp 1920w',
        );
        heroPreload.setAttribute('imagesizes', '100vw');
        heroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(heroPreload);
      }
    </script>
